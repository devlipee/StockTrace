spring.application.name=StockTrace

# Usa os dados da configuração local existente
spring.config.import=classpath:config.properties

spring.datasource.url=${db.url}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password}

# Confere o mapeamento das entidades sem modificar as tabelas
spring.jpa.hibernate.ddl-auto=validate

# Mantém o acesso ao banco na camada de serviço
spring.jpa.open-in-view=false